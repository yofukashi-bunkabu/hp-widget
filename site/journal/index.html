<!doctype html>
<html lang="ja">
<head>
<!--@head-->
<title>記録｜夜更文化部</title>
<meta name="description" content="夜更文化部の記録。note の連載「美術館制覇記」と、夜更けの地図の口コミ。">
</head>
<body>
<!--@bar-->
<div class="ph">
  <div class="wrap">
    <span class="lab">JOURNAL</span>
    <h1>記録</h1>
    <p>会のある週もない週も、観たことを書いて残しています。長めの記事は note の連載「美術館制覇記」に、行った館のひとことは「夜更けの地図」に。</p>
  </div>
</div>

<section class="sec">
  <div class="wrap">
    <div class="head"><h2>美術館制覇記</h2><span class="lab">NOTE</span></div>
    <!--@journal-->
    <div class="btns"><a class="btn fill" href="https://note.com/yofukashibunkabu/m/mda89b8c27499">note でマガジンを見る</a></div>
  </div>
</section>

<section class="sec paper">
  <div class="wrap">
    <div class="head"><h2>夜更けの地図</h2><span class="lab">MAP</span></div>
    <p>行った美術館・博物館を、ひとことと一緒に地図に残す場所です。だれでも読めて、Google でログインすると自分の記録を残せます。口コミは「自分だけ」から始まり、「みんなに公開」にしたものだけがここに並びます。</p>
    <div class="revs" id="revs"><p class="empty">公開された口コミはまだありません。</p></div>
    <div class="btns"><a class="btn fill" href="../map/">地図を開く</a><a class="btn" href="../map/privacy.html">口コミと個人情報の扱い</a></div>
  </div>
</section>

<!--@foot-->
<script type="module">
import { makeStore } from "../map/store.js";
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
(async () => {
  const store = makeStore();
  if (store.mode !== "live") return;
  try {
    await store.init(() => {});
    const rows = (await store.publicReviews()).filter((r) => r.text).sort((a, b) => (b.date || "").localeCompare(a.date || "")).slice(0, 30);
    if (!rows.length) return;
    document.getElementById("revs").innerHTML = rows.map((r) => `<div class="rev"><b>${esc(r.placeName)}</b><span class="m">${esc((r.date || "").replaceAll("-", "."))}${r.exhibition ? "　" + esc(r.exhibition) : ""}　${esc(r.nickname || "")}</span>${r.stars ? `<span class="s">${"★".repeat(r.stars)}</span>` : ""}<span class="t">${esc(r.text)}</span></div>`).join("");
  } catch (e) { console.error(e); }
})();
</script>
</body>
</html>
